MODEL:
  PRETRAIN_CHOICE: 'finetune'
  PRETRAIN_PATH: 'C:\Users\revol\DLSVP1-ReID\Patch-Aware-Transformer\part_attention_vit_60.pth'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  CLASS_AWARE:
    ENABLED: False
    NUM_CLASSES: 0
    LOSS_WEIGHT: 1.0
    DISTANCE_PENALTY: 0.3
    TRAIN_CSV: "train_classes_filtered.csv"
    QUERY_CSV: "query_classes.csv"
    TEST_CSV: "test_classes.csv"
    RETRIEVAL_SOURCE: "predicted"

INPUT:
  SIZE_TRAIN: [256,128]
  SIZE_TEST: [256,128]
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ:
    ENABLED: True
    PROB: 0.5
    HUE: 0.02
  LGT: # Local Grayscale Transfomation
    DO_LGT: False
    PROB: 0.5

DATASETS:
  TRAIN: ('UrbanElementsReID', 'UrbanElementsReID_localval')
  TEST: ('UrbanElementsReID',)
  #ROOT_DIR: ('../../data') # root of datasets
  ROOT_DIR: 'C:\Users\revol\DLSVP1-ReID\Patch-Aware-Transformer\data\datasets\Urban2026'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 0

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 2
  BASE_LR: 0.001 # 0.0004 for msmt
  GRAD_CLIP_ENABLED: True
  GRAD_CLIP_NORM: 1.0
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/' # root of log file
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './model'

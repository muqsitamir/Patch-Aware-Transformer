MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  #PRETRAIN_PATH: "../../.cache/torch/hub/checkpoints" # root of pretrain path
  PRETRAIN_PATH: "/home/muqsitamir/models/" # 
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  CLASS_AWARE:
    ENABLED: True
    NUM_CLASSES: 0
    LOSS_WEIGHT: 1.0
    DISTANCE_PENALTY: 0.3
    TRAIN_CSV: "train_classes.csv"
    QUERY_CSV: "query_classes.csv"
    TEST_CSV: "test_classes.csv"
    RETRIEVAL_SOURCE: "predicted"

INPUT:
  SIZE_TRAIN: [256,128]
  SIZE_TEST: [256,128]
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT: # Local Grayscale Transfomation
    DO_LGT: True
    PROB: 0.5

DATASETS:
  TRAIN: ('UrbanElementsReID',)
  TEST: ('UrbanElementsReID_test',)
  #ROOT_DIR: ('../../data') # root of datasets
  ROOT_DIR: '/home/muqsitamir/datasets/Urban2026/'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 0.001 # 0.0004 for msmt
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: "./models/model/part_attention_vit_60.pth" #test 
  NECK_FEAT: 'before'
  FEAT_NORM: True
  CLASS_POSTPROCESS: "penalty_additive"
  CLASS_TOPK: 100
  CLASS_MISMATCH_PENALTY: 0.3
  CLASS_SCORE_MODE: "additive"
  CLASS_SCALE: 1.2
  QUERY_EXPANSION: False
  QE_TOPK: 5
  QE_ALPHA: 1.0
  SAVE_FEATURES: True
  FEAT_Q_PATH: "./qf.npy"
  FEAT_G_PATH: "./gf.npy"

LOG_ROOT: 'models/' # root of log file
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './model'

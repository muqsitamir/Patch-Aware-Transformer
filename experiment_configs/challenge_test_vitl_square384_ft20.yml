MODEL:
  PRETRAIN_CHOICE: 'none'
  PRETRAIN_PATH: ""
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  CLASS_AWARE:
    ENABLED: False
    NUM_CLASSES: 0
    LOSS_WEIGHT: 0.0
    DISTANCE_PENALTY: 0.0
    TRAIN_CSV: "train_classes.csv"
    QUERY_CSV: "query_classes.csv"
    TEST_CSV: "test_classes.csv"
    RETRIEVAL_SOURCE: "predicted"

INPUT:
  SIZE_TRAIN: [384,384]
  SIZE_TEST: [384,384]
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT:
    DO_LGT: False
    PROB: 0.3

DATASETS:
  TRAIN: ('UrbanElementsReID',)
  TEST: ('UrbanElementsReID_test',)
  ROOT_DIR: ''

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 2
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 20
  BASE_LR: 0.0002
  IMS_PER_BATCH: 4
  WARMUP_METHOD: 'linear'
  CHECKPOINT_PERIOD: 1
  LOG_PERIOD: 60
  EVAL_PERIOD: 1
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_BIAS: 0.0
  BIAS_LR_FACTOR: 1
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 16
  RE_RANKING: False
  WEIGHT: ""
  NECK_FEAT: 'before'
  FEAT_NORM: True
  TTA_ENABLED: True
  TTA_FLIP: True
  CLASS_POSTPROCESS: "off"
  CLASS_TOPK: 100
  CLASS_MISMATCH_PENALTY: 0.0
  CLASS_SCORE_MODE: "additive"
  CLASS_SCALE: 1.2
  QUERY_EXPANSION: False
  QE_TOPK: 5
  QE_ALPHA: 1.0
  SAVE_FEATURES: True
  FEAT_Q_PATH: "./qf.npy"
  FEAT_G_PATH: "./gf.npy"

LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './ft_ext_vitl_square384_ft20_submit'
